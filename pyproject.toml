[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrclib-web"
version = "0.1.0"
description = "Self-hosted web UI for downloading synced lyrics (.lrc) from LRCLIB for a local music library"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mutagen==1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["lrclib_web"]

[tool.setuptools.package-data]
lrclib_web = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
